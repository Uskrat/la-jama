<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Monitor de Cocina - Estación Caliente - La Jama</title>
    <th:block th:replace="~{links :: headLinks}"></th:block>

    <link rel="stylesheet" th:href="@{/css/cocina-core.css}">
    <link rel="stylesheet" th:href="@{/css/cocina-caliente.css}">

    <style>
        .btn-alerta-ticket {
            animation: latido-rojo 1.5s infinite;
        }
        @keyframes latido-rojo {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
    </style>
</head>
<body class="cocina-body cocina-caliente">

<div class="wrapper">
    <div th:replace="~{sidebar :: sidebar(activeUri='/admin/cocina/caliente')}"></div>

    <main id="main-content" class="main-content">
        <div th:replace="~{sidebar :: logistica_header('Monitoreo Caliente')}"></div>

        <div class="pedidos-grid-header px-4 mt-3 d-flex justify-content-end">
            <div class="status-badge-jama px-3 py-2 rounded-pill shadow-sm">
                <i class="bi bi-fire me-2"></i> ORDENES PENDIENTES: <span th:text="${#lists.size(pedidos)}">0</span>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(pedidos)}" class="text-center py-5 mt-5 text-muted animate__animated animate__fadeIn">
            <i class="bi bi-clipboard2-check-fill text-warning" style="font-size: 5rem; opacity: 0.8;"></i>
            <h3 class="mt-3 fw-bold text-dark">No hay pedidos recientes</h3>
            <p class="fs-5 text-muted">Los fogones están controlados y al día. ¡Buen trabajo equipo!</p>
        </div>

        <div th:unless="${#lists.isEmpty(pedidos)}" class="pedidos-grid">
            <div th:each="p : ${pedidos}" class="card-pedido" th:id="'pedido-' + ${p.id}">
                <div class="card-header">
                    <span class="badge-id">ORD. #[[${p.id}]]</span>
                    <div class="timer-container" th:data-start="${p.fechaCreacion}">
                        <i class="bi bi-stopwatch me-1"></i>
                        <span class="timer-display">00:00</span>
                    </div>
                </div>

                <div class="card-body">
                    <h5 class="cliente-nombre">
                        Mesa: <span th:text="${p.numeroMesa != null ? p.numeroMesa : p.cliente}"></span>
                    </h5>

                    <div th:if="${p.direccion != null and !p.direccion.isEmpty()}">
                        <small style="color: #dc3545; font-weight: bold; display: block; margin-bottom: 8px; font-size: 0.85rem;">
                            [[${p.direccion}]]
                        </small>
                    </div>

                    <div class="items-lista">
                        <div class="item-plato p-2 mb-1 rounded animate__animated animate__fadeIn"
                             th:each="d : ${p.getListaDetalles()}"
                             th:if="${d.producto != null && d.producto.categoria != null && #strings.contains(#strings.toUpperCase(d.producto.categoria.nombre), 'CALIENTE') && !d.cocinado}"
                             th:style="${d.canceladoPorCliente} ? 'background-color: #ffe5e5; border-left: 5px solid #dc3545 !important; opacity: 0.85;' : (!d.impresoEnCocina ? 'background-color: rgba(255, 193, 7, 0.15); border-left: 3px solid #ffc107;' : 'border-left: 3px solid transparent;')">

                            <div class="d-flex align-items-center justify-content-between w-100">
                                <div class="d-flex align-items-center">
                                    <span class="item-cantidad" th:classappend="${d.canceladoPorCliente} ? 'bg-danger text-white' : ''" th:text="${d.cantidad}">1</span>

                                    <span class="item-nombre fw-bold"
                                          th:classappend="${d.canceladoPorCliente} ? 'text-danger text-decoration-line-through' : 'text-dark'"
                                          th:text="${d.producto.nombre}">Plato Caliente</span>
                                </div>

                                <div class="d-flex align-items-center gap-2">
    <span th:if="${!d.impresoEnCocina && !d.canceladoPorCliente}"
          class="badge bg-warning text-dark shadow-sm animate__animated animate__pulse animate__infinite">
        <i class="bi bi-star-fill me-1"></i>NUEVO
    </span>

                                    <span th:if="${d.canceladoPorCliente}"
                                          class="badge bg-danger text-white shadow-sm fw-bold px-2 py-1">
        <i class="bi bi-exclamation-octagon-fill me-1"></i>MERMA
    </span>

                                    <button th:if="${!d.canceladoPorCliente && d.impresoEnCocina}"
                                            type="button"
                                            class="btn btn-sm btn-outline-success"
                                            th:onclick="despacharItemCocina([[${p.id}]], [[${d.id}]], '[[${d.producto.nombre}]]')"
                                            title="Despachar este plato a barra"
                                            style="padding: 2px 8px; font-weight: bold;">
                                        <i class="bi bi-check2-all"></i>
                                    </button>

                                    <button th:if="${!d.canceladoPorCliente && !d.impresoEnCocina}"
                                            type="button"
                                            class="btn btn-sm btn-light border text-muted opacity-50"
                                            disabled
                                            title="¡Acción bloqueada! Primero debes imprimir el ticket físico para habilitar el despacho."
                                            style="padding: 2px 8px; cursor: not-allowed;">
                                        <i class="bi bi-lock-fill"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-footer" th:with="nuevosCalientes=${p.getListaDetalles().?[!canceladoPorCliente && !impresoEnCocina && producto != null && producto.categoria != null && producto.categoria.nombre.toUpperCase().contains('CALIENTE')]}">
                    <div class="footer-actions d-flex gap-2 w-100">

                        <a th:href="@{'/admin/cocina/ticket/' + ${p.id} + '/caliente'}" target="_blank"
                           class="btn w-100 fw-bold d-flex align-items-center justify-content-center"
                           th:classappend="${#lists.isEmpty(nuevosCalientes)} ? 'btn-secondary' : 'btn-danger btn-alerta-ticket'">
                            <i class="bi bi-printer me-2"></i> [[${#lists.isEmpty(nuevosCalientes)} ? 'Reimprimir' : 'Imprimir Ticket']]
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block th:replace="~{links :: scriptLinksPlus}"></th:block>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script th:src="@{/js/cocina-caliente.js}" defer></script>
</body>
</html>
