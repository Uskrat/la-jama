<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Menú - La Jama</title>
    <th:block th:replace="~{links :: headLinks}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin_productos.css}">
</head>
<body class="bg-light">

<div class="wrapper">
    <div th:replace="~{sidebar :: sidebar(activeUri='/admin/productos')}"></div>

    <main class="main-content">
        <div th:replace="~{sidebar :: logistica_header('Gestión de Productos')}"></div>

        <div class="container-fluid py-4 px-4">
            <div class="card card-tabla shadow-sm border-0 rounded-4">
                <div class="card-header bg-white d-flex justify-content-between align-items-center py-3 border-bottom">
                    <h4 class="mb-0 fw-bold text-jama-green"><i class="bi bi-egg-fried me-2"></i> Lista de Productos del Menú</h4>
                    <button class="btn btn-success rounded-pill px-4" onclick="abrirModalNuevo()">
                        <i class="bi bi-plus-circle me-2"></i> Nuevo Plato
                    </button>
                </div>

                <div class="card-body p-4">
                    <div class="row mb-4">
                        <div class="col-md-4">
                            <div class="input-group search-container">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-search"></i></span>
                                <input type="text" id="busqueda" class="form-control bg-light border-0" placeholder="Buscar plato o categoría..." onkeyup="filtrarTabla()">
                            </div>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="tablaProductos">
                            <thead>
                            <tr>
                                <th>Imagen</th>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="p : ${productos}" th:id="'prod-row-' + ${p.id}">
                                <td>
                                    <img th:src="${p.imagen != null ? '/imagenes/' + p.imagen : '/img/no-photo.png'}"
                                         class="img-thumbnail rounded-3 shadow-sm" style="width: 60px; height: 60px; object-fit: cover;">
                                </td>
                                <td>
                                    <span class="d-block fw-bold text-dark">[[${p.nombre}]]</span>
                                    <small class="text-muted d-block text-truncate" style="max-width: 250px;">[[${p.descripcion}]]</small>
                                </td>
                                <td>
                                    <span th:class="${#strings.contains(#strings.toUpperCase(p.categoria.nombre), 'FRÍ') || #strings.contains(#strings.toUpperCase(p.categoria.nombre), 'FRI')} ? 'badge bg-info text-dark' : 'badge bg-warning text-dark'">
                                        [[${p.categoria.nombre}]]
                                    </span>
                                </td>
                                <td class="fw-bold text-jama-skin">S/ [[${#numbers.formatDecimal(p.precio, 1, 2)}]]</td>
                                <td>
                                    <span th:class="${p.stock <= 5} ? 'badge bg-danger' : 'badge bg-success'">
                                        [[${p.stock}]] uds
                                    </span>
                                </td>
                                <td>
                                    <div class="form-check form-switch custom-switch-jama">
                                        <input class="form-check-input" type="checkbox" th:checked="${p.estado == 1}"
                                               th:onchange="'cambiarEstado(' + ${p.id} + ', this)'">
                                    </div>
                                </td>
                                <td class="text-center">
                                    <div class="btn-group btn-group-sm" role="group">
                                        <button class="btn btn-outline-primary" th:onclick="'editarProducto(' + ${p.id} + ')'" title="Editar">
                                            <i class="bi bi-pencil-square"></i>
                                        </button>
                                        <button class="btn btn-outline-danger" th:onclick="'eliminarProducto(' + ${p.id} + ')'" title="Eliminar">
                                            <i class="bi bi-trash3"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Modal Formulario -->
<div class="modal fade" id="modalProducto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow-lg">
            <form id="formProducto" th:action="@{/admin/productos/guardar}" method="post" enctype="multipart/form-data">
                <div class="modal-header text-white">
                    <h5 class="modal-title fw-bold" id="modalTitulo">Nuevo Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" id="prodId" name="id">
                    <div class="row g-4">
                        <div class="col-md-4 text-center border-end">
                            <label class="form-label fw-bold text-jama-green">Imagen del Plato</label>
                            <div class="mb-3 mx-auto shadow-sm rounded-3 overflow-hidden border d-flex align-items-center justify-content-center bg-light" style="width: 150px; height: 150px;">
                                <img id="imgPrevia" th:src="@{/img/no-photo.png}" class="img-fluid" style="max-height: 100%; object-fit: cover;">
                            </div>
                            <input type="file" name="archivoImagen" class="form-control form-control-sm" accept="image/*" onchange="previewImage(event)">
                        </div>
                        <div class="col-md-8">
                            <div class="mb-3">
                                <label class="form-label fw-bold small text-jama-green">Nombre del Plato</label>
                                <input type="text" id="prodNombre" name="nombre" class="form-control rounded-3" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold small text-jama-green">Descripción</label>
                                <textarea id="prodDesc" name="descripcion" class="form-control rounded-3" rows="2"></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-bold small text-jama-green">Precio (S/)</label>
                                    <input type="number" id="prodPrecio" name="precio" class="form-control rounded-3" step="0.01" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-bold small text-jama-green">Stock</label>
                                    <input type="number" id="prodStock" name="stock" class="form-control rounded-3" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-bold small text-jama-green">Categoría</label>
                                    <select id="prodCat" name="categoria.id" class="form-select rounded-3" required>
                                        <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0 p-4 bg-light">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cerrar</button>
                    <button type="submit" class="btn btn-success rounded-pill px-4">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{links :: scriptLinksPlus}"></th:block>
<script th:src="@{/js/admin_productos.js}"></script>
</body>
</html>
