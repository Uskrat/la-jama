<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Jama - Nueva Comanda</title>
    <th:block th:replace="~{links :: headLinks}"></th:block>
    <link rel="stylesheet" th:href="@{/css/mesero.css}">
</head>
<body>
<div class="d-flex">
    <div th:replace="~{sidebar :: sidebar(activeUri='/admin/mesas')}"></div>

    <main id="main-content" class="main-content w-100 bg-light">
        <div th:replace="~{sidebar :: logistica_header('Nueva Comanda')}"></div>

        <div class="container-fluid p-4">
            <div class="comanda-wrapper">
                <div class="productos-seccion">
                    <div class="search-box">
                        <i class="bi bi-search fs-4"></i>
                        <input type="text" id="buscador" class="form-control shadow-sm"
                               placeholder="Buscar plato o bebida..." onkeyup="filtrarProductos()">
                    </div>

                    <div class="row row-cols-1 row-cols-md-3 g-4" id="grid-productos">
                        <div th:each="prod : ${productos}" class="col producto-card">
                            <div class="card h-100 menu-item shadow-sm"
                                 th:data-id="${prod.id}"
                                 th:data-nombre="${prod.nombre}"
                                 th:data-precio="${prod.precio}"
                                 onclick="abrirModalInsumos(this)">
                                <img th:src="${prod.imagen != null ? '/imagenes/' + prod.imagen : 'https://placehold.co/400x300?text=Sin+Foto'}"
                                     class="card-img-top" alt="Plato">
                                <div class="card-body p-3">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <span class="badge bg-primary-subtle text-primary border-0 px-2"
                                              th:text="${prod.categoria.nombre}"></span>
                                        <span class="fw-bold text-success fs-5">S/ [[${#numbers.formatDecimal(prod.precio, 1, 2)}]]</span>
                                    </div>
                                    <h6 class="card-title fw-bold text-dark mb-0 nombre-producto"
                                        th:text="${prod.nombre}"></h6>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="carrito-sidebar shadow-sm">
                    <h5 class="fw-bold mb-4 text-dark"><i class="bi bi-bag-check me-2"></i>Detalle de Orden</h5>

                    <div class="mb-3">
                        <div class="form-floating mb-2">
                            <input type="text" id="cliente" class="form-control" placeholder="Mesa" readonly>
                            <label for="cliente">Mesa</label>
                        </div>
                        <div class="form-floating">
                            <input type="text" id="direccion" class="form-control" placeholder="Nota general">
                            <label for="direccion">Nota de la Orden</label>
                        </div>
                    </div>

                    <div id="lista-items" class="lista-items-scroll"></div>

                    <div class="pt-4 border-top">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <span class="h5 text-muted mb-0">Total</span>
                            <span class="h2 fw-bold text-primary mb-0">S/ <span id="total-monto">0.00</span></span>
                        </div>
                        <button class="btn btn-success btn-lg w-100 py-3 fw-bold shadow-sm" onclick="enviarPedido()">
                            ENVIAR A COCINA
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Modal Personalización Insumos Estandarizado -->
<div class="modal fade" id="modalInsumos" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header bg-dark text-white">
                <h6 class="modal-title fw-bold" id="modalNombrePlato">Personalizar Plato</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <p class="text-muted small mb-3"><i class="bi bi-info-circle me-1"></i>Desmarca los insumos que el cliente <b>NO</b> desea:</p>
                <div id="listaInsumosModal" class="mb-0"></div>
            </div>
            <div class="modal-footer bg-light border-0">
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-sm btn-success rounded-pill px-3" onclick="confirmarAgregarAlCarrito()">Aceptar</button>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{links :: scriptLinksPlus}"></th:block>
<script th:src="@{/js/mesero.js}"></script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const mesaId = urlParams.get('mesaId');
        if (mesaId) {
            document.getElementById('cliente').value = 'Mesa #' + mesaId;
        }
    });
</script>
</body>
</html>
