<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Insumos - La Jama</title>
    <th:block th:replace="~{links :: headLinks}"></th:block>
    <link rel="stylesheet" th:href="@{/css/insumos.css}">
</head>
<body class="bg-light">
<div class="wrapper">
    <div th:replace="~{sidebar :: sidebar(activeUri='/insumos')}"></div>

    <main id="main-content" class="main-content">
        <div th:replace="~{sidebar :: logistica_header('Gestión de Insumos')}"></div>

        <div class="container-fluid p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold text-dark mb-0">Control de Almacén e Ingredientes</h4>
                <button class="btn btn-primary rounded-pill px-4" onclick="abrirModalNuevoInsumo()">
                    <i class="bi bi-plus-circle me-2"></i> Nuevo Insumo
                </button>
            </div>

            <div class="card border-0 shadow-sm rounded-4 mb-4">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-3 text-dark">Lista de Insumos</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                            <tr>
                                <th>Item</th>
                                <th>Producto Insumo</th>
                                <th>Unidad Medida</th>
                                <th>Stock Actual</th>
                                <th>Stock Mínimo</th>
                                <th class="text-center" style="width: 160px;">Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="insumo, i : ${insumos}">
                                <td th:text="${i.count}"></td>
                                <td>
                                    <input type="text" class="form-control form-control-sm bg-transparent border-0 fw-semibold" th:id="'nombre_' + ${insumo.id}" th:value="${insumo.nombre}"/>
                                </td>
                                <td>
                                    <input type="text" class="form-control form-control-sm bg-transparent border-0 text-muted" style="width: 80px;" th:id="'unidad_' + ${insumo.id}" th:value="${insumo.unidadMedida}"/>
                                </td>
                                <td>
                                    <input type="number" step="0.01" class="form-control form-control-sm" style="width: 100px;" th:id="'stockActual_' + ${insumo.id}" th:value="${insumo.stockActual}"/>
                                </td>
                                <td>
                                    <input type="number" step="0.01" class="form-control form-control-sm" style="width: 100px;" th:id="'stockMinimo_' + ${insumo.id}" th:value="${insumo.stockMinimo}"/>
                                </td>
                                <td class="text-center">
                                    <div class="d-flex justify-content-center gap-1">
                                        <button class="btn btn-sm btn-warning rounded-3" th:onclick="'editarInsumo(' + ${insumo.id} + ')'" title="Guardar">
                                            <i class="bi bi-save"></i> Guardar
                                        </button>
                                        <form th:action="@{/insumos/eliminar/{id}(id=${insumo.id})}" method="post" class="m-0" th:onsubmit="'return confirmarEliminacion(event, ' + ${insumo.id} + ')'" th:id="'form-eliminar-' + ${insumo.id}">
                                            <button type="submit" class="btn btn-sm btn-danger rounded-3">Eliminar</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm rounded-4 mb-4">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-3 text-dark">Asignar Insumo a Receta de Plato</h5>
                    <form method="post" class="row g-3" id="formAsignar" th:action="@{/insumos/producto/0/agregar}">
                        <div class="col-md-4">
                            <label class="form-label fw-bold small">Plato de Destino</label>
                            <select name="idProductoSelect" class="form-select rounded-3" id="selectProducto" onchange="actualizarAccion(this.value)">
                                <option value="">Selecciona un plato...</option>
                                <option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.nombre}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold small">Componente Insumo</label>
                            <select name="idInsumo" class="form-select rounded-3">
                                <option value="">Selecciona un insumo...</option>
                                <option th:each="ins : ${insumos}" th:value="${ins.id}" th:text="${ins.nombre + ' (' + ins.unidadMedida + ')'}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold small">Cantidad Requerida</label>
                            <input type="number" step="0.01" name="cantidad" class="form-control rounded-3" placeholder="Ej: 0.200"/>
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <button type="submit" class="btn btn-success w-100 rounded-pill">Asignar a Receta</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card border-0 shadow-sm rounded-4 mb-4">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-3 text-dark">Recetario Operativo por Plato</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Plato Base</th>
                                <th class="text-center" style="width: 200px;">Composición</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="p, i : ${productos}">
                                <td th:text="${i.count}"></td>
                                <td th:text="${p.nombre}" class="fw-semibold text-dark"></td>
                                <td class="text-center">
                                    <button type="button"
                                            class="btn btn-sm btn-outline-primary rounded-pill px-3 btn-ver-receta"
                                            th:data-id="${p.id}"
                                            th:data-nombre="${p.nombre}">
                                        <i class="bi bi-eye me-1"></i> Ver Receta
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>

<div class="modal fade" id="modalNuevoInsumo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header bg-dark text-white p-3">
                <h5 class="modal-title fw-bold fs-6"><i class="bi bi-box-seam me-2"></i>Registrar Insumo en Catálogo</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/insumos/guardar}" method="post" id="formNuevoInsumo">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Nombre del Insumo / Materia Prima</label>
                        <input type="text" name="nombre" class="form-control rounded-3" placeholder="Ej: Pescado Tollo" required/>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold">Unidad de Medida</label>
                            <input type="text" name="unidadMedida" class="form-control rounded-3" placeholder="kg, lt, und" required/>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold">Stock Inicial</label>
                            <input type="number" step="0.01" name="stockActual" class="form-control rounded-3" placeholder="0.00" required/>
                        </div>
                    </div>
                    <div class="mb-0">
                        <label class="form-label small fw-bold">Punto de Stock Mínimo (Alerta)</label>
                        <input type="number" step="0.01" name="stockMinimo" class="form-control rounded-3" placeholder="0.00" required/>
                    </div>
                    <input type="hidden" name="estado" value="1"/>
                </div>
                <div class="modal-footer bg-light border-0 p-3">
                    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-sm btn-primary rounded-pill px-4">Dar de Alta</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="modalDetalleReceta" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header bg-dark text-white p-3">
                <h5 class="modal-title fw-bold fs-6" id="tituloModalReceta">Componentes del Plato</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <div class="table-responsive">
                    <table class="table table-sm align-middle small">
                        <thead class="table-light">
                        <tr>
                            <th>Insumo</th>
                            <th>Unidad</th>
                            <th class="text-end">Cantidad</th>
                            <th class="text-center">Acción</th>
                        </tr>
                        </thead>
                        <tbody id="cuerpoDetalleReceta"></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer bg-light border-0 p-2">
                <button type="button" class="btn btn-sm btn-secondary rounded-pill px-3" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{links :: scriptLinksPlus}"></th:block>
<script th:src="@{/js/insumos.js}"></script>
</body>
</html>
