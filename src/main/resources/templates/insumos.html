<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Insumos</title>
    <th:block th:replace="~{links :: headLinks}"></th:block>
</head>
<body class="bg-light">
<div class="wrapper">
    <div th:replace="~{sidebar :: sidebar(activeUri='/insumos')}"></div>

    <main id="main-content" class="main-content">
        <div th:replace="~{sidebar :: logistica_header('Gestión de Insumos')}"></div>

        <div class="container-fluid p-4">

            <!-- Formulario agregar insumo -->
            <div class="card border-0 shadow-sm rounded-4 mb-4">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Agregar Insumo</h5>
                    <form th:action="@{/insumos/guardar}" method="post" class="row g-3">
                        <div class="col-md-3">
                            <input type="text" name="nombre" class="form-control" placeholder="Nombre del insumo" required/>
                        </div>
                        <div class="col-md-2">
                            <input type="text" name="unidadMedida" class="form-control" placeholder="Unidad (kg, lt, und)"/>
                        </div>
                        <div class="col-md-2">
                            <input type="number" step="0.01" name="stockActual" class="form-control" placeholder="Stock actual"/>
                        </div>
                        <div class="col-md-2">
                            <input type="number" step="0.01" name="stockMinimo" class="form-control" placeholder="Stock mínimo"/>
                        </div>
                        <input type="hidden" name="estado" value="1"/>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">Agregar</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Lista de insumos -->
            <div class="card border-0 shadow-sm rounded-4 mb-4">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Lista de Insumos</h5>
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nombre</th>
                                <th>Unidad</th>
                                <th>Stock Actual</th>
                                <th>Stock Mínimo</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                            <tbody>
        <tr th:each="insumo, i : ${insumos}">
            <td th:text="${i.count}"></td>
            <td><input type="text" class="form-control form-control-sm"
                    th:id="'nombre_' + ${insumo.id}"
                    th:value="${insumo.nombre}"/></td>
            <td><input type="text" class="form-control form-control-sm"
                    th:id="'unidad_' + ${insumo.id}"
                    th:value="${insumo.unidadMedida}"/></td>
            <td><input type="number" step="0.01" class="form-control form-control-sm"
                    th:id="'stockActual_' + ${insumo.id}"
                    th:value="${insumo.stockActual}"/></td>
            <td><input type="number" step="0.01" class="form-control form-control-sm"
                    th:id="'stockMinimo_' + ${insumo.id}"
                    th:value="${insumo.stockMinimo}"/></td>
            <td class="d-flex gap-1">
                <button class="btn btn-sm btn-warning"
                        th:onclick="'editarInsumo(' + ${insumo.id} + ')'">
                    Guardar
                </button>
                <form th:action="@{/insumos/eliminar/{id}(id=${insumo.id})}" method="post">
                    <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                </form>
            </td>
        </tr>
    </tbody>
                    </table>
                </div>
            </div>

            <!-- Asignar insumos a platos -->
            <div class="card border-0 shadow-sm rounded-4 mb-4">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Asignar Insumo a Plato</h5>
                    <form method="post" class="row g-3" id="formAsignar"
                          th:action="@{/insumos/producto/0/agregar}">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Plato</label>
                            <select name="idProductoSelect" class="form-select" id="selectProducto"
                                    onchange="actualizarAccion(this.value)">
                                <option value="">Selecciona un plato...</option>
                                <option th:each="p : ${productos}"
                                        th:value="${p.id}"
                                        th:text="${p.nombre}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Insumo</label>
                            <select name="idInsumo" class="form-select">
                                <option value="">Selecciona un insumo...</option>
                                <option th:each="ins : ${insumos}"
                                        th:value="${ins.id}"
                                        th:text="${ins.nombre + ' (' + ins.unidadMedida + ')'}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold">Cantidad</label>
                            <input type="number" step="0.01" name="cantidad"
                                   class="form-control" placeholder="Ej: 0.200"/>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-success w-100">Asignar</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Insumos asignados por plato -->
            <div class="card border-0 shadow-sm rounded-4 mb-4">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Insumos por Plato</h5>
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Plato</th>
                                <th>Insumo</th>
                                <th>Unidad</th>
                                <th>Cantidad</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ip, i : ${insumosProductos}">
                                <td th:text="${i.count}"></td>
                                <td th:text="${ip.nombreProducto}"></td>
                                <td th:text="${ip.nombreInsumo}"></td>
                                <td th:text="${ip.unidadMedida}"></td>
                                <td th:text="${ip.cantidadUsada}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>
</div>

<th:block th:replace="~{links :: scriptLinks}"></th:block>
<script>
    function actualizarAccion(idProducto) {
        if (idProducto) {
            document.getElementById('formAsignar').action = '/insumos/producto/' + idProducto + '/agregar';
        }
    }
</script>
<script>
async function editarInsumo(id) {
    const nombre = document.getElementById('nombre_' + id).value;
    const unidadMedida = document.getElementById('unidad_' + id).value;
    const stockActual = document.getElementById('stockActual_' + id).value;
    const stockMinimo = document.getElementById('stockMinimo_' + id).value;

    const response = await fetch('/insumos/editar/' + id, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, nombre, unidadMedida, stockActual, stockMinimo })
    });

    if (response.ok) {
        alert('Insumo actualizado');
    } else {
        alert('Error al actualizar');
    }
}
</script>
</body>
</html>
